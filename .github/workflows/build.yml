name: Build

on:
  push:
    branches: ["master", "voice-messages", "voice-capture-v2", "video-webcam-capture"]
  pull_request:
    branches: ["master", "voice-messages", "voice-capture-v2", "video-webcam-capture"]
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build Minecraft addon
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: plasmo-telegram-voice
          path: build/libs/*.jar

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
