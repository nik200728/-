plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.plasmoverse.com/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // OpenPnP Capture Java ships the native capture binaries inside its jar.
    // Bundle both it and its JNA runtime so webcam capture is available from the
    // final Fabric mod instead of depending on a separately installed library.
    include "org.openpnp:openpnp-capture-java:${project.openpnp_capture_version}"
    include "net.java.dev.jna:jna:5.13.0"

    compileOnly "su.plo.voice.api:client:${project.plasmo_voice_api_version}"
    compileOnly "su.plo.voice.api:server:${project.plasmo_voice_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}